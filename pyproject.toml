[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rei-checker-mcp"
version = "0.3.0a1"
description = "Formal-verification checker MCP server — one expression, three-valued verdict, no LLM in judgment path"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "AGPL-3.0-or-later" }
authors = [
    { name = "藤本 伸樹 (Nobuki Fujimoto)", email = "fc2webb@gmail.com" },
]
keywords = ["mcp", "verification", "lean4", "formal-methods", "checker"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.optional-dependencies]
test = []

[project.scripts]
rei-checker = "rei_checker.__main__:main"

[project.urls]
Homepage = "https://github.com/fc0web/rei-checker-mcp"
Repository = "https://github.com/fc0web/rei-checker-mcp"
Issues = "https://github.com/fc0web/rei-checker-mcp/issues"

[tool.setuptools.packages.find]
include = ["rei_checker*"]
exclude = ["tests*", "lean_backend*"]
